<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:512px;height:512px;overflow:hidden;display:grid;place-items:center;
 background:linear-gradient(150deg,#7c6dff 0%,#4f46e5 58%,#4338ca 100%);
 font-family:"PingFang SC","Microsoft YaHei",sans-serif }
.wrap{position:relative;width:100%;height:100%;display:grid;place-items:center}
.ring{position:absolute;width:330px;height:330px;border:10px solid rgba(255,255,255,.22);border-radius:50%}
.u{font-size:250px;font-weight:800;color:#fff;letter-spacing:-.05em;line-height:1;
   text-shadow:0 14px 34px rgba(30,20,90,.35);transform:translateY(-6px)}
.badge{position:absolute;right:78px;bottom:96px;width:104px;height:104px;border-radius:50%;
 background:#ef4444;display:grid;place-items:center;box-shadow:0 10px 24px rgba(200,30,30,.45)}
.badge span{font-size:58px;font-weight:800;color:#fff;line-height:1;transform:translateY(-4px)}
</style></head><body><div class="wrap">
<div class="ring"></div><div class="u">U</div>
<div class="badge"><span>!</span></div>
</div></body></html>
